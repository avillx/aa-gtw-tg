[project]
name = "myapi-client"
version = "1.2.0"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pytelegrambotapi>=4.36"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.basedpyright]
include = ["src", "tests"]
extraPaths = ["src", "tests"]

[[tool.basedpyright.executionEnvironments]]
root = "tests"
typeCheckingMode = "off"
extraPaths = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python = "venv"

[tool.mypy]
strict = true

[tool.setuptools]
packages = ["agent", "telegram", "arch_agent"]
